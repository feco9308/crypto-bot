[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-market-intelligence"
dynamic = ["version"]
description = "Public-data Spot scanner and auditable paper trading; no live execution"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "SQLAlchemy>=2.0,<3", "requests>=2.32,<3", "python-dotenv>=1.0,<2", "gunicorn>=23,<24", "alembic>=1.14,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
legacy = ["pandas>=2.2,<3", "ta>=0.11,<0.12", "binance-connector>=3,<4"]

[project.scripts]
market-scanner = "crypto_bot.main:main"

[tool.setuptools.packages.find]
include = ["crypto_bot*"]

[tool.setuptools.package-data]
"crypto_bot.web" = ["templates/*.html", "static/*"]
"crypto_bot.storage" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.dynamic]
version = {attr = "crypto_bot.version.__version__"}
