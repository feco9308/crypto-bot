<form method="post" action="{{ url_for('override') }}" class="override"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="symbol" value="{{ row.symbol }}"><label><span class="sr-only">{{ row.symbol }} user override</span><select name="status">{% for status in statuses %}<option {% if status == row.user_override %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><button>Mentés</button></form>
